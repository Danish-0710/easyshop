version: '3.8'

services:
  mongodb:
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  auth-service:
    build:
      context: ./services/auth-service
      target: development
    environment:
      - NODE_ENV=development
    volumes:
      - ./services/auth-service:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3001:3001"

  product-service:
    build:
      context: ./services/product-service
      target: development
    environment:
      - NODE_ENV=development
    volumes:
      - ./services/product-service:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3002:3002"

  cart-service:
    build:
      context: ./services/cart-service
      target: development
    environment:
      - NODE_ENV=development
    volumes:
      - ./services/cart-service:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3003:3003"

  shop-service:
    build:
      context: ./services/shop-service
      target: development
    environment:
      - NODE_ENV=development
    volumes:
      - ./services/shop-service:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3005:3005"

  notification-service:
    build:
      context: ./services/notification-service
      target: development
    environment:
      - NODE_ENV=development
    volumes:
      - ./services/notification-service:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3006:3006"

volumes:
  mongodb_data:
  redis_data:
  rabbitmq_data:
